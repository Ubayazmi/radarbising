; User PHP configuration for vercel-php runtime
; This file is appended to the runtime's default php.ini

; Enable PostgreSQL PDO driver
extension=pdo_pgsql

; Enable PostgreSQL native driver (required by pdo_pgsql)
extension=pgsql

; Common extensions that may be needed
extension=gd
extension=mbstring
extension=curl
extension=fileinfo
extension=openssl
extension=zip
extension=intl
extension=bcmath
extension=opcache

; Performance settings
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=4000
opcache.revalidate_freq=60
opcache.fast_shutdown=1

; Security
expose_php=Off
display_errors=Off
log_errors=On
error_reporting=E_ALL & ~E_DEPRECATED & ~E_STRICT

; File uploads
file_uploads=On
upload_max_filesize=10M
post_max_size=10M

; Session
session.cookie_secure=1
session.cookie_httponly=1
session.cookie_samesite=Lax
session.use_strict_mode=1
session.gc_maxlifetime=31536000