name: Supabase Migration

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no data written)'
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'supabase/schema.sql'
      - 'migrate.php'
      - 'composer.json'
      - 'composer.lock'
      - '.github/workflows/migrate.yml'

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: |
            pdo
            pdo_sqlite
            pdo_pgsql
            mbstring
            iconv
            gd
            curl
          ini-values: |
            memory_limit=512M
            max_execution_time=300

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Backup SQLite
        run: |
          cp database.sqlite database.sqlite.bak
          echo "✓ Backup created"

      - name: Apply Supabase Schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push --schema-file supabase/schema.sql

      - name: Run Migration (Dry Run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
          SQLITE_PATH: database.sqlite
        run: |
          php migrate.php --dry-run

      - name: Run Migration (Live)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
          SQLITE_PATH: database.sqlite
        run: |
          php migrate.php

      - name: Verify Migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false }}
        env:
          DB_DSN: ${{ secrets.DB_DSN }}
        run: |
          php -r '
            $pg = new PDO($ENV["DB_DSN"]);
            $tables = ["users","articles","videos","login_logs","settings"];
            foreach ($tables as $t) {
                $count = $pg->query("SELECT COUNT(*) FROM $t")->fetchColumn();
                echo "$t: $count rows\n";
            }
            // Verify sequences
            foreach ($tables as $t) {
                $seq = $pg->query("SELECT last_value FROM {$t}_id_seq")->fetchColumn();
                echo "$t sequence: $seq\n";
            }
          '

      - name: Create Storage Bucket
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase storage buckets create radarbising-uploads --public 2>/dev/null || echo "Bucket already exists"

      - name: Summary
        if: always()
        run: |
          echo "### Migration Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Trigger: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- Dry run: ${{ github.event.inputs.dry_run || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY