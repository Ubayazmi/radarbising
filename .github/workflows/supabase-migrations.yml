name: Supabase Schema Migrations

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (no apply)'
        type: boolean
        default: true
      apply:
        description: 'Apply migrations (use with dry_run=false)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: List migrations
        run: |
          supabase migration list --project-ref $SUPABASE_PROJECT_REF

      - name: Diff schema (dry-run preview)
        if: github.event.inputs.dry_run == 'true'
        run: |
          supabase db diff --schema public --project-ref $SUPABASE_PROJECT_REF

      - name: Apply migrations
        if: github.event.inputs.apply == 'true' && github.event.inputs.dry_run == 'false'
        run: |
          supabase migration up --project-ref $SUPABASE_PROJECT_REF
