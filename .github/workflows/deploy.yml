name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: |
            pdo
            pdo_pgsql
            pdo_sqlite
            mbstring
            iconv
            gd
            curl
          ini-values: |
            memory_limit=512M

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Verify PHP syntax
        run: |
          find . -name "*.php" -not -path "./vendor/*" -not -path "./assets/*" -exec php -l {} \; 2>&1 | grep -v "No syntax errors" || echo "All PHP files OK"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            vercel --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --prod
          else
            vercel --token=$VERCEL_TOKEN --scope=$VERCEL_ORG_ID --previews
          fi